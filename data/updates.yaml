# Content for the "Latest Updates" section on the homepage.
#
# Add a new entry at the top (newest first isn't required -- the build
# script sorts by date -- but it's easiest to read this file that way).
# Then run `bin/build-updates` (or just push -- see the GitHub Actions
# workflow) to regenerate docs/index.html.
#
# date: YYYY-MM-DD
# title: plain text, no HTML needed
# paragraphs: one list item per <p>, plain text, no HTML needed

- date: "2026-10-16"
  title: "Every example now run and checked, plus a new date-handling example and a guide to what needs installing"
  paragraphs:
    - "I've now run every example program in the book on Perl 5.40, and that turned up a surprising number of bugs: a wrong byte in the PNG signature check, a regular expression that captured the wrong part of a number, example files that had drifted away from the listings in the chapters, and a few that no longer worked. They're all fixed, and a set of scripts now checks that the listings in the chapters match the programs that I actually ran."
    - "Chapter 6 has a new worked example: finding out when you write code, by analysing the time stamps in a git history (with a warning about the time zone traps along the way). It replaces a web-server-log example that depended on a module that hasn't been updated since 2003. In Chapter 9 the first edition's scraper for a long-dead Yahoo! weather page has been replaced by a short cautionary tale about why scraping is fragile and what to do instead. Chapter 3 gained a runnable Test2::V0 example, and its DBI example now works out of the box with SQLite."
    - "Appendix B has a short section on regular expressions and a table showing, chapter by chapter, which modules you need to install from CPAN and which already come with Perl. Chapters 9 and 10 explain HTTP::Tiny, which has been part of Perl since 5.14, and what you need for HTTPS (LWP::Protocol::https for LWP). Chapter 10's weather example has been expanded. I also checked every claim about which version of Perl introduced a feature, corrected several, and made the spelling consistently British."

- date: "2026-10-02"
  title: "Regular expressions overhauled, plus chapter audits and a rewritten Appendix B"
  paragraphs:
    - "Chapter 4 (pattern matching and regular expressions) has had a full rewrite: a batch of long-standing bugs fixed, plus proper coverage of named captures, non-greedy quantifiers, lookbehind and `\\K`, transliteration with tr///, and the lesser-known `/m`, `/s`, `/a`, `/r` and `/xx` modifiers. There's also a new section on Regexp::Common, a handy library of ready-made patterns, with Appendix A updated to match."
    - "Chapters 1, 2 and 12 have all had a full modernity pass, and Appendix B (Essential Perl) has been rewritten from scratch around a modern baseline -- strict/warnings, feature bundles, signatures and postfix dereferencing, rather than the practices I'd have taught in 2001."
    - "Smaller things: a new Web::Query section in chapter 9, refreshed example data for the CD-collection examples used throughout the book, and a few new diagrams."

- date: "2026-09-18"
  title: "New testing section, and a chapter 8 tidy-up"
  paragraphs:
    - "Chapter 3 gained a new section on testing with Test::More and Test2, plus a rewritten benchmarking section and a database example that now uses SQLite."
    - "There's also a new section explaining Perl's `use feature` and `use VERSION` pragmas, using modern subroutine signatures as the example."
    - "Chapter 8 (the introduction to parsers) has had a full refresh, and chapter 5 picked up a short new bit on older text encodings like ISO-8859-X."

- date: "2026-09-04"
  title: "Unicode, Path::Tiny and brand-new diagrams"
  paragraphs:
    - "Chapter 3 gained a new section on Path::Tiny for cleaner, safer file and directory handling."
    - "Every diagram in the book has been redrawn from scratch in a cleaner, more consistent style."
    - "Chapter 7 (binary and packed data) has had a full refresh, including a new diagram showing exactly how a PNG file is structured byte by byte."

- date: "2026-08-21"
  title: "Next update imminent"
  paragraphs:
    - "The next update to the WIP version will be released tomorrow."
    - "This includes updates to the date/time chapter. And a big update on Unicode/UTF8."
    - "If you've bought the WIP edition, you'll get an email telling you when the new version is available."

- date: "2026-08-07"
  title: "New website is live"
  paragraphs:
    - "This site has had a full refresh, covering the second edition."
    - "Most importantly, I've added this section, so you can track what I'm doing."

- date: "2026-08-06"
  title: "Work-in-progress edition now on Leanpub"
  paragraphs:
    - "The second edition has been available as a work in progress from LeanPub for some time. But I've finally worked out how to add a progress indicator to the book page and how to send emails to customers whenever it is updated."
    - "Buying the work-in-progress edition gets you free updates as new chapters land, right through to the finished book."

- date: "2026-08-06"
  title: "Chapter 10 rewritten: JSON, YAML and XML"
  paragraphs:
    - "Chapter 10 has been retitled \"Common Data Interchange Formats\" and rebuilt around the three formats you'll actually meet in the wild: JSON, YAML and XML."
    - "New sections cover JSON::MaybeXS and YAML::PP with a live weather-API example, alongside a modernized XML::LibXML treatment that replaces the old XML::Parser/XML::DOM material."
    - "Completion estimate: 65%"
